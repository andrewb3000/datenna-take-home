apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: datenna
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: datenna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "app"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-inject-secret-env: "secret/data/app"
        vault.hashicorp.com/agent-inject-template-env: |
          {{- with secret "secret/data/app" -}}
          DB_PASSWORD={{ .Data.data.db_password }}
          MINIO_SECRET_KEY={{ .Data.data.minio_secret_key }}
          {{- end -}}
    spec:
      serviceAccountName: app-sa
      containers:
        - name: app
          image: datenna-app:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: datenna
spec:
  selector:
    app: app
  ports:
    - port: 8000
      targetPort: 8000
